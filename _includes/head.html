<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ page.description | default: site.description }}" />
<meta name="author" content="{{ site.name }}" />
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}" />
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ '/assets/images/krishna-patel.jpg' | absolute_url }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}" />
<meta name="twitter:description" content="{{ page.description | default: site.description }}" />
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#0f172a',
          accent: '#1e40af',
          muted: '#64748b'
        },
        fontFamily: {
          sans: ['"Source Sans 3"', 'ui-sans-serif', 'system-ui']
        }
      }
    }
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  .skip-link {
    position: absolute;
    left: -999px;
    top: auto;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  .skip-link:focus {
    left: 1rem;
    top: 1rem;
    width: auto;
    height: auto;
    padding: 0.75rem 1rem;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    border-radius: 0.5rem;
    z-index: 1000;
  }
</style>
{% if page.extra_head %}{{ page.extra_head }}{% endif %}
